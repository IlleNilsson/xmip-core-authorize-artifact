[package]
name = "xmip-core-authorize-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-artifact"
description = "Artifact authorization: what this identity may do to this named artifact — post into a Receive Location, run in a Process, be presented through a Send Location — from a list of grants; a transport-layer policy. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Authorizer trait is authorize's, the facts it
# judges are context's, and the layer and Party identifier are xmip-core's.
authorize = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
